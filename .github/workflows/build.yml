name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El proyecto no incluye gradlew, así que se instala Gradle directamente.
      # AGP 8.7.2 necesita Gradle 8.9 o superior.
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Los-Simpson-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publica el APK en la sección Releases del repositorio
      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Los Simpson v${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
